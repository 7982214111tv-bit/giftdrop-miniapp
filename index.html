<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiftDrop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .app {
      padding: 40px 20px;
    }

    .logo {
      font-size: 70px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
    }

    .balance {
      background: #222;
      border-radius: 15px;
      padding: 18px;
      margin: 25px auto;
      max-width: 300px;
      font-size: 20px;
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 16px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">🎁</div>

  <h1>GiftDrop</h1>

  <div class="balance">
    ⭐ Points: <span id="points">0</span>
  </div>

  <button onclick="play()">🎮 Start Playing</button>
  <button onclick="rewards()">🎁 Rewards</button>
  <button onclick="profile()">👤 My Profile</button>
  <button onclick="leaderboard()">🏆 Leaderboard</button>

</div>

<script>
function play() {
  alert("🎮 Game coming soon!");
}

function rewards() {
  alert("🎁 Rewards section coming soon!");
}

function profile() {
  alert("👤 Profile coming soon!");
}

function leaderboard() {
  alert("🏆 Leaderboard coming soon!");
}
</script>

</body>
</html>
